name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    # A hung test can never burn a whole runner again: per-test pytest-timeout
    # (pytest.ini) plus this job ceiling make CI deterministic.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Compile and syntax checks
        run: |
          python -m compileall -q services packages ui scripts hood_cli.py
          node --check ui/static/app.js
      # Linux is the deployment platform and the gating run: the whole suite,
      # with live/network/Windows-only tests skipped with an explicit reason.
      - name: Test suite — full (Linux, gating)
        if: runner.os == 'Linux'
        run: python -m pytest -q -rs --junitxml=junit-${{ matrix.os }}.xml
      # The Windows runner validates Windows *compatibility* — the whole codebase
      # imports, compiles and syntax-checks on Windows (the step above, which
      # catches Windows-only import/path/syntax breakage). It does NOT run the
      # behavioural suite: the loopback-HTTP integration surface is Linux-served
      # (covered by the gating run), and several tests (win32 desktop APIs on a
      # headless runner, bootstrap, threaded x-control) block in native calls a
      # thread-based timeout cannot interrupt. Behaviour is validated on Linux;
      # deep Windows desktop/vault validation is an owner-machine step
      # (docs/RUNBOOK.md), which a headless CI runner cannot perform.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: junit-${{ matrix.os }}
          path: junit-${{ matrix.os }}.xml

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit -r requirements.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM
        run: |
          python -m pip install -r requirements.txt
          python scripts/generate_sbom.py --out SBOM.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: SBOM.cdx.json

  docker-build:
    # Builds the production image and smoke-tests the container (boot + health)
    # in a clean environment, so the Dockerfile is verified on every push.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hood:ci
      - name: Smoke test — container boots, binds loopback, serves the API
        run: |
          docker run -d --name hood-ci hood:ci
          ok=""
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' hood-ci 2>/dev/null || echo starting)
            echo "attempt $i: health=$s"
            if [ "$s" = "healthy" ]; then ok=1; break; fi
            if [ "$s" = "unhealthy" ]; then break; fi
            sleep 3
          done
          echo "--- container logs ---"; docker logs hood-ci | tail -20
          docker exec hood-ci curl -fsS -H "Host: 127.0.0.1:8990" http://127.0.0.1:8990/api/auth/status
          docker rm -f hood-ci
          test -n "$ok"

  release-gate:
    # Manual: produces commit-bound evidence. Expected to report NO_GO until G0-G7 are satisfied.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Preproduction gate
        run: python scripts/preproduction_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence
          path: release/evidence/
