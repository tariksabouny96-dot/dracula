# Production topology for HOOD.
#
# `hood` binds 127.0.0.1:8990 inside its own network namespace. `proxy` (Caddy)
# shares that namespace (network_mode: service:hood), so it reaches HOOD over
# loopback — exactly the reverse-proxy-in-front-of-a-loopback-service model the
# RUNBOOK describes. HOOD never listens on a routable address itself; only
# Caddy's 443 is published.
#
# Set HOOD_PUBLIC_HOST to the hostname you serve on; Caddy obtains a TLS cert
# for it and HOOD's Host allowlist is pinned to it (HOOD_ALLOWED_HOSTS).
#
# First-run owner setup is NEVER possible through the proxy: Caddy reaches HOOD over
# loopback too, so HOOD treats any request carrying proxy headers as remote, and the
# setup also needs the one-time code printed in HOOD's log. Create the owner from the
# server's terminal instead (nothing to expose):
#   docker compose exec -it hood python hood_cli.py init-owner
# Keep this stack off the public internet until the security GO (see
# docs/SECURITY_REMEDIATION_BATCH1.md); reach it over a VPN/SSH tunnel meanwhile.

services:
  hood:
    build: .
    image: hood:latest
    environment:
      # Caddy forwards the public Host header; HOOD only answers for it.
      HOOD_ALLOWED_HOSTS: "${HOOD_PUBLIC_HOST:-hood.local}:443"
      # Caddy is the only proxy in front of HOOD: believe the client address it adds
      # (per-client login limits), and never treat proxied requests as local.
      HOOD_TRUSTED_PROXY: "1"
      # Provider + secrets come from the host environment / secret manager. The Gemini key can also
      # be saved in Settings > Model provider (encrypted vault on the /data volume). The former
      # HOOD_GEMINI_CREDENTIAL=proxy setting only works behind a key-injecting egress proxy (a
      # development cloud), so a production container used to send every request with no key.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      HOOD_MODEL_PRICING: "${HOOD_MODEL_PRICING:-}"
      HOOD_VAULT_KEY: "${HOOD_VAULT_KEY:-}"
      HOOD_RECEIPT_KEY: "${HOOD_RECEIPT_KEY:-}"
      HOOD_MIGRATION_KEY: "${HOOD_MIGRATION_KEY:-}"
    volumes:
      - hood-data:/data
    restart: unless-stopped
    # Uncomment to allow agent-execution sandboxing (unprivileged user namespaces):
    # security_opt:
    #   - seccomp:unconfined

  proxy:
    image: caddy:2.8-alpine
    network_mode: "service:hood"   # share HOOD's netns -> reach it on 127.0.0.1
    depends_on:
      - hood
    environment:
      HOOD_PUBLIC_HOST: "${HOOD_PUBLIC_HOST:-hood.local}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  hood-data:
  caddy-data:
  caddy-config:
