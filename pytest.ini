[pytest]
testpaths = tests
addopts = -p no:cacheprovider
# No single test may run longer than 5 minutes. A hang becomes a named
# failure with a full thread dump instead of silently stalling CI (the
# `thread` method is cross-platform — it works on Windows runners too).
timeout = 300
timeout_method = thread
markers =
    live_provider: calls a real paid model provider; needs HOOD_RUN_LIVE_PROVIDER=1, a configured key and HOOD_MODEL_PRICING
    live_network: reaches the public internet; needs HOOD_RUN_LIVE_NETWORK=1 and outbound access
    windows_only: needs a real Windows desktop session
    browser_e2e: drives a real headless Chromium; runs on Linux CI (the web console is a Linux-served surface) and is skipped on Windows runners
