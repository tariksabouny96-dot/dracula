[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    live_provider: calls a real paid model provider; needs HOOD_RUN_LIVE_PROVIDER=1, a configured key and HOOD_MODEL_PRICING
    live_network: reaches the public internet; needs HOOD_RUN_LIVE_NETWORK=1 and outbound access
    windows_only: needs a real Windows desktop session
